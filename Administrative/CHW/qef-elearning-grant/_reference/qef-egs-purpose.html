										<h2>電子學習撥款計劃</h2>
										<h3>計劃宗旨</h3>
										<p>為支援學校在「新常態」下推行混合教學模式，優質教育基金推行此項撥款計劃，讓公營中小學及直接資助計劃學校申請撥款，購買流動電腦裝置供有經濟需要的學生借用，以及向因居住環境所限而未能獲得合適上網服務的學生提供可攜式無線網絡路由器及流動數據卡，讓學生享有平等的電子學習機會。</p>
